<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Line on Map - 東京の路線図</title>
    <meta name="description" content="東京近郊の電車・地下鉄・バスを、実際に通っているルートで地図上に表示します。路線をクリックすると強調表示されます。" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ff8a00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Line on Map" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="controls" aria-label="表示切り替え">
      <div class="row">
        <button type="button" id="btn-search" class="round" aria-label="路線を検索" title="路線を検索して1本だけ表示">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="btn-route" class="round" aria-label="ルートを探す" title="出発駅から到着駅までのルートを探す" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="6" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="18" cy="6" r="2.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8.600 18H14a3.500 3.500 0 0 0 0-7h-4a3.500 3.500 0 0 1 0-7h5.400" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/></svg>
        </button>
        <label class="pill" title="電車"><input type="checkbox" data-cat="train" checked /><i class="dot" style="--c:#00a040"></i>電車</label>
        <label class="pill" title="地下鉄"><input type="checkbox" data-cat="subway" checked /><i class="dot" style="--c:#0072bc"></i>地下鉄</label>
        <label class="pill" title="バス(都営)"><input type="checkbox" data-cat="bus" checked /><i class="dot" style="--c:#d9531e"></i>バス</label>
      </div>
    </aside>

    <div id="bottom">
      <section id="panel" hidden aria-live="polite">
        <button type="button" id="panel-close" aria-label="選択を解除">×</button>
        <div class="panel-head">
          <span class="badge" id="panel-badge"></span>
          <h2 id="panel-title"></h2>
        </div>
        <div class="panel-meta">
          <p id="panel-sub"></p>
          <button type="button" id="btn-solo" hidden>この路線だけ表示</button>
        </div>
        <p id="panel-detail"></p>
        <div id="panel-others" hidden>
          <span id="panel-others-label">この地点を通る他の路線</span>
          <div id="panel-others-list"></div>
        </div>
      </section>
      <section id="route-panel" hidden aria-label="ルート検索">
        <div class="route-head">
          <h2>ルートを探す</h2>
          <button type="button" id="route-close" aria-label="ルート検索を閉じる">×</button>
        </div>
        <div class="route-fields">
          <div class="route-field">
            <input id="route-from" type="search" placeholder="出発駅" aria-label="出発駅" autocomplete="off" disabled />
            <ul id="route-from-list" class="suggest" role="listbox" hidden></ul>
          </div>
          <button type="button" id="route-swap" class="round small" aria-label="出発と到着を入れ替え" title="出発と到着を入れ替え">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 4v16M8 4 4 8M8 4l4 4M16 20V4M16 20l-4-4M16 20l4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="route-field">
            <input id="route-to" type="search" placeholder="到着駅" aria-label="到着駅" autocomplete="off" disabled />
            <ul id="route-to-list" class="suggest" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="route-opts">
          <label title="バス停も乗り換え・移動に使います"><input type="checkbox" id="route-bus" />バスも使う</label>
          <label title="川崎 → 京急川崎 のように、別の駅名の駅へ歩いて乗り換えます"><input type="checkbox" id="route-walk" />駅の外を歩く乗り換えも許す</label>
        </div>
        <p id="route-msg"></p>
        <ol id="route-results"></ol>
      </section>
      <div id="filter-row" hidden>
        <div class="search">
          <input id="line-search" type="search" placeholder="路線名で検索" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="line-list" disabled />
          <ul id="line-list" role="listbox" hidden></ul>
        </div>
        <button type="button" id="btn-reset-view" class="round" aria-label="全路線を表示に戻す" title="全路線を表示に戻す" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div id="status" role="status">路線データを読み込み中…</div>

    <section id="no-webgl" role="alert" hidden>
      <h1>地図を表示できません</h1>
      <p>このブラウザでは WebGL が使えないため、地図を描画できません。</p>
      <p>Chrome の場合は、設定の「システム」で<strong>「グラフィックアクセラレーションが使用可能な場合は使用する」</strong>をオンにしてブラウザを再起動してください。<code>chrome://gpu</code> で WebGL の状態を確認できます。</p>
      <p>それでも表示されない場合は、別のブラウザ(Safari・Firefox・Edge など)をお試しください。</p>
    </section>

    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
